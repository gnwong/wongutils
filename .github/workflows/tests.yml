name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Run tracked tests
        run: python -m pytest tests/
